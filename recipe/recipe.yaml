schema_version: 1

context:
  version: 9.2.1

package:
  name: deepdiff
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deepdiff/deepdiff-${{ version }}.tar.gz
  sha256: 6ca37d0c19b6cc75808239992172c9c26942192445073a01a7e58138f5f3594c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - flit-core >=3.11,<5
  run:
    - orderly-set >=5.5.0,<6
    - python >=${{ python_min }}
    - cachebox >=6.1.2,<7
tests:
  - python:
      imports:
        - deepdiff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Deep Difference and Search of any Python object/data.
  license: MIT
  license_file: LICENSE
  description: |
    Deep Difference of dictionaries, iterables, strings and other objects.
    It will recursively look for all the changes.
  homepage: https://github.com/seperman/deepdiff
  repository: https://github.com/seperman/deepdiff
  documentation: http://deepdiff.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - loriab
    - seperman
    - synapticarbors
